<style>
	:root {
		--width-max: 45rem;
		--font: sans-serif;
		
		--accent: #ee0000;
		--accent-faint: #ee000055;
		
		--bg-color-primary: #fafafa;
		--bg-color-secondary: #f2f2f2;
		
		--text-color-primary: #333333;
		--text-color-secondary: #666666;
		
		--border-color: #e0e0e0;
		--link-decoration-color: #999999;
	}
	
	@media (prefers-color-scheme: dark) {
		:root {
			--accent: #bc0000;
			--accent-faint: #bc000055;
			
			--bg-color-primary: #181818;
			--bg-color-secondary: #1c1c1c;
			
			--text-color-primary: #e5e5e5;
			--text-color-secondary: #b3b3b3;
			
			--border-color: #30363d;
			--link-decoration-color: #666666;
		}
	}
	
	*::selection {
		color: var(--accent);
		background-color: var(--accent-faint);
	}
	
	body {
		background-color: var(--bg-color-primary);
		color: var(--text-color-primary);
		
		padding: 2rem;
		max-width: var(--width-max);
		margin: auto;
		vertical-align: baseline;
		
		tab-size: 4;
		text-indent: 0;
		line-height: 1.8;
		text-align: start;
		letter-spacing: normal;
		font-family: var(--font);
		text-rendering: optimizeLegibility;
		scroll-behavior: smooth;
		word-wrap: break-word;
		overflow-wrap: break-word;
	}
	
	h1 {
		font-size: 1.5rem;
		line-height: 1.2;
	}
	
	h2 {
		font-size: 1.4rem;
	}
	
	h3 {
		font-size: 1.3rem;
	}
	
	h4 {
		font-size: 1.2rem;
	}
	
	h5 {
		font-size: 1.1rem;
	}
	
	h6 {
		font-size: 1rem;
	}
	
	a {
		color: var(--text-color-primary);
		font-weight: 500;
		cursor: pointer;
		text-decoration: underline;
		text-decoration-color: var(--link-decoration-color);
	}
	
	a:hover {
		color: var(--accent);
		text-decoration-color: var(--accent);
	}
	
	nav {
		margin-bottom: 4rem;
		margin-top: 1rem;
		text-align: right;
	}
	
	nav a {
		margin-left: 20px;
		text-align: left;
	}
	
	textarea {
		width: 100%;
		font-size: 16px;
	}
	
	input {
		font-size: 14px;
	}
	
	content {
		line-height: 1.6;
	}
	
	table {
		width: 100%;
		border-collapse: collapse;
		border: 1px solid var(--border-color);
		border-radius: 4px;
	}
	
	th,
	td {
		border: 1px solid var(--border-color);
		padding: 4px;
	}
	
	th {
		background-color: var(--bg-color-secondary);
	}
	
	hr {
		border: 0;
		border-top: 1px dashed;
	}
	
	img {
		max-width: 100%;
		display: block;
		margin-left: auto;
		margin-right: auto;
		border: 1px solid var(--border-color);
		border-radius: 4px;
		content-visibility: auto;
	}
	
	img[src*="#minipic"] {
		max-width: 50%;
		margin-left: 0;
		margin-right: auto;
	}
	
	.image-caption figcaption {
		text-align: center;
		font-style: italic;
		font-size: 0.8em;
		margin-top: 0.6em;
		color: var(--text-color-secondary);
	}
	
	.image-caption {
		margin: auto;
	}
	
	i {
		font-style: normal;
	}
	
	time {
		font-family: var(--font-secondary);
		font-size: 15px;
	}
	
	code {
		font-family: var(--font-secondary);
		background-color: var(--bg-color-secondary);
		padding: 2px;
		border-radius: 4px;
	}
	
	pre code {
		display: block;
		padding: 16px;
		white-space: pre-wrap;
		overflow-x: auto;
	}
	
	div.highlight pre {
		border-radius: 4px;
	}
	
	div.highlight code {
		background-color: var(--bg-color-secondary);
	}
	
	blockquote {
		border-left: 4px solid var(--border-color);
		color: var(--text-color-secondary);
		margin: 0;
		padding-left: 8px;
		font-style: normal;
	}
	
	blockquote p {
		margin: 0;
	}
	
	footer {
		padding: 25px 0;
	}
	
	audio {
		border-radius: 5px;
		width: 100%;
		margin: 20px 0 20px 0;
		display: block;
	}
	
	ul li:has(input) {
		list-style-type: none;
		margin-left: -25.5px;
	}
	
	ul.blog-posts {
		list-style-type: none;
		padding: unset;
	}
	
	.post-item {
		border-bottom: 1px solid var(--border-color);
		display: grid;
		grid-template-columns: 5fr 1fr;
		margin: 20px 0 0 0;
		padding: 0;
	}
	
	.post-item > a {
		text-decoration: none;
	}
	
	.post-item > a > h2 {
		margin: 0 0 .4rem 0;
		font-size: 1rem;
		font-weight: 500;
		color: var(--text-color-primary);
		display: flex;
		justify-content: flex-start;
		align-items: center;
	}
	
	.post-item > a > h2:hover {
		color: var(--accent);
	}
	
	.title {
		display: flex;
		align-items: center;
		justify-content: flex-start;
	}
	
	.date {
		font-size: 0.8rem;
		color: #666;
		margin: 0;
		text-align: right;
		display: flex;
		align-items: center;
		justify-content: flex-end;
	}
	
	body:has(.image-zoom-toggle:checked) {
		overflow: hidden;
	}
	
	.image-zoom-container {
		position: relative;
		display: block;
	}
	
	.image-zoom-toggle {
		display: none;
	}
	
	.image-zoom-label {
		cursor: zoom-in;
		display: block;
		position: relative;
	}
	
	.image-zoom-label:focus {
		outline: 2px solid var(--link-color);
		outline-offset: 2px;
	}
	
	.zoomable-image {
		transition: transform 0.3s ease;
	}
	
	.image-zoom-overlay {
		display: none;
		position: fixed;
		top: 0;
		left: 0;
		right: 0;
		bottom: 0;
		background: rgba(0, 0, 0, 0.9);
		z-index: 1000;
		align-items: center;
		justify-content: center;
		padding: 20px;
		margin: 0;
	}
	
	.image-zoom-toggle:checked ~ .image-zoom-overlay {
		display: flex;
		cursor: zoom-out;
	}
	
	.image-zoom-toggle:checked ~ .image-zoom-label {
		cursor: default;
	}
	
	.image-zoom-toggle:checked ~ .image-zoom-overlay .zoomable-image {
		max-width: 90vw;
		max-height: 90vh;
		width: auto;
		height: auto;
		transform: scale(1);
		border: none;
		border-radius: 8px;
		box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
		margin-left: auto !important;
		margin-right: auto !important;
	}
	
	.image-zoom-toggle:checked ~ .image-zoom-overlay::before {
		content: "";
		position: absolute;
		top: 20px;
		right: 20px;
		width: 32px;
		height: 32px;
		background: rgba(255, 255, 255, 0.9);
		border-radius: 50%;
		cursor: pointer;
		z-index: 1001;
	}
	
	.image-zoom-toggle:checked ~ .image-zoom-overlay::after {
		content: "✕";
		position: absolute;
		top: 20px;
		right: 20px;
		width: 32px;
		height: 32px;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 18px;
		font-weight: bold;
		color: #000;
		cursor: pointer;
		z-index: 1002;
	}
	
	.image-zoom-toggle:checked ~ .image-zoom-overlay figcaption {
		position: fixed;
		bottom: 20px;
		left: 50%;
		transform: translateX(-50%);
		background: rgba(0, 0, 0, 0.8);
		color: white;
		padding: 8px 16px;
		border-radius: 4px;
		font-size: 14px;
		z-index: 1001;
		max-width: 80vw;
		text-align: center;
	}
	
	.skip-link {
		position: absolute;
		top: -48px;
		left: 0;
		background: var(--accent);
		color: white;
		padding: 8px;
		text-decoration: none;
		z-index: 100;
	}
	
	.skip-link:focus {
		top: 0;
	}
	
	#search-input {
		width: 100%;
		box-sizing: border-box;
		padding: 10px 14px;
		font-size: 1rem;
		border: 1px solid var(--border-color);
		border-radius: 6px;
		outline: none;
		transition: border-color 0.2s, box-shadow 0.2s;
		background-color: var(--background-color);
		color: var(--text-color);
		margin-bottom: 1.5rem;
	}
	
	#search-input:focus {
		border-color: var(--accent);
		box-shadow: 0 0 3px var(--accent-faint);
	}
	
	#search-input::placeholder {
		color: var(--text-color-secondary);
		opacity: 0.6;
	}
</style>
